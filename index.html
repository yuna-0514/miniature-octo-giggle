                    <div class="max-w-md mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <h3 class="text-xl font-bold serif mb-4 text-white">監測精準度調查</h3>
                        <p class="text-xs text-gray-400 mb-8">基於剛才的作答，你認為結果會契合你嗎？</p>
                        <div class="flex justify-center gap-2 mb-10">
                            ${[1,2,3,4,5].map(v => `<button onclick="window.setAccuracy(${v})" class="w-12 h-12 rounded-xl border border-white/10 hover:bg-indigo-600 transition-all text-white">${v}</button>`).join('')}
                        </div>
                        <p class="text-[10px] text-gray-600 uppercase tracking-widest">Awaiting Pulse Confirmation...</p>
                    </div>
                `;
            } else if (state.view === 'result') {
                const mbti = calculateMBTI();
                const info = zodiacData[state.zodiac];
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto glass p-10 rounded-[40px] animate-fade-in">
                        <div class="text-center mb-10">
                            <h1 class="text-6xl font-bold mbti-glow serif italic mb-2">${mbti}</h1>
                            <p class="text-xs text-gray-500">${state.username} 的完整能量報告</p>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="p-8 bg-white/5 rounded-[32px] border border-white/5">
                                <h3 class="text-indigo-300 font-bold mb-3 serif">🌌 星座核心建議</h3>
                                <p class="text-sm leading-relaxed text-gray-300">${info.core}</p>
                            </div>
                            <div class="p-8 bg-white/5 rounded-[32px] border border-white/5">
                                <h3 class="text-indigo-300 font-bold mb-3 serif">💖 愛情引力建議</h3>
                                <p class="text-sm leading-relaxed text-gray-300">${info.love}</p>
                            </div>
                            <div class="p-8 bg-white/5 rounded-[32px] border border-white/5">
                                <h3 class="text-indigo-300 font-bold mb-3 serif">🤝 友情衛星建議</h3>
                                <p class="text-sm leading-relaxed text-gray-300">${info.friend}</p>
                            </div>
                            <div class="p-8 bg-white/5 rounded-[32px] border border-white/5">
                                <h3 class="text-indigo-300 font-bold mb-3 serif">🚀 生活軌道建議</h3>
                                <p class="text-sm leading-relaxed text-gray-300">${info.life}</p>
                            </div>
                        </div>
                        <button id="saveBtn" class="w-full py-5 mt-10 bg-white text-black rounded-2xl font-bold tracking-[0.5em] hover:bg-gray-200 transition-all">同步資料至實驗室</button>
                    </div>
                `;
                document.getElementById('saveBtn').onclick = () => saveResult(mbti);
            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定'){ state.view = 'quiz'; render(); }};
        window.answer = (type, text) => { 
            state.scores[type]++; 
            state.answers.push(text);
            if(state.currentQ+1 < questions.length){ state.currentQ++; render(); } 
            else { state.view = 'pre-result'; render(); }
        };
        window.setAccuracy = (val) => { state.accuracy = val; state.view = 'result'; render(); };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        async function saveResult(mbti) {
            if (state.isSaving) return;
            state.isSaving = true;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "資料同步中...";
            btn.disabled = true;

            const payload = {
                account: state.username,
                password: "N/A",
                process: state.answers.join(' | '),
                mbti: `${mbti} (${state.zodiac})`,
                score: state.accuracy,
                feedback: "觀測實驗完成"
            };

            try {
                // 1. Firestore - 加入守護確保有 user 且 db 正常
                if (auth.currentUser) {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pulseRecords'), {
                        ...payload,
                        timestamp: serverTimestamp()
                    });
                }

                // 2. Google Sheets
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                btn.innerText = "同步成功！";
                btn.classList.add('bg-emerald-500', 'text-white');
            } catch (e) {
                console.error(e);
                btn.innerText = "同步失敗，但已盡力保存";
                btn.disabled = false;
                state.isSaving = false;
            }
        }
    </script>
</body>
</html>
