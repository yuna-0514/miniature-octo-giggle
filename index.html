                        <div class="glass p-12 rounded-[50px] text-center">
                            <h1 class="text-8xl font-bold mbti-glow serif italic mb-6">${mbti}</h1>
                            <p class="text-2xl text-gray-400 mb-2">${state.username} · ${state.zodiac}</p>
                            <div class="inline-block px-4 py-1 bg-white/10 rounded-full text-xs tracking-widest text-indigo-300 uppercase">ASTRAL COORDINATES COMPLETED</div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="glass p-10 rounded-[40px] space-y-6">
                                <h3 class="text-2xl font-bold serif text-indigo-400 flex items-center">
                                    <span class="mr-3">🪐</span> 星座核心建議
                                </h3>
                                <p class="card-content text-gray-200">${advice.core}</p>
                                <div class="pt-4 space-y-6">
                                    <div>
                                        <h4 class="text-lg font-bold text-pink-400 mb-2">💘 愛情導航</h4>
                                        <p class="text-gray-400 card-content">${advice.love}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-lg font-bold text-blue-400 mb-2">🤝 友情引力</h4>
                                        <p class="text-gray-400 card-content">${advice.friend}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-lg font-bold text-green-400 mb-2">🌿 生活校準</h4>
                                        <p class="text-gray-400 card-content">${advice.life}</p>
                                    </div>
                                </div>
                            </div>

                            <div class="glass p-10 rounded-[40px] flex flex-col justify-between">
                                <div>
                                    <h3 class="text-2xl font-bold serif text-indigo-400 mb-8">本次實驗精準度？</h3>
                                    <div class="flex justify-between gap-2 mb-10">
                                        ${[1,2,3,4,5].map(v => `
                                            <button onclick="window.setAccuracy(${v})" class="accuracy-btn flex-1 py-6 rounded-2xl border border-white/10 text-2xl font-bold transition-all ${state.accuracy === v ? 'active' : 'bg-white/5'}">
                                                ${v}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <p class="text-gray-500 text-center italic">1 分為偏差極大，5 分為完美契合</p>
                                </div>
                                <button id="saveBtn" onclick="window.saveAll('${mbti}')" class="w-full py-6 bg-white text-black rounded-[30px] font-bold tracking-[0.5em] text-xl hover:bg-gray-200 transition-all mt-10">同步星際資料庫</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定') { state.view = 'quiz'; render(); } else { alert("請輸入暱稱並選擇星座"); } };
        
        window.answer = (type, optionIdx) => { 
            state.scores[type]++;
            // 儲存格式範例: Q1-選項1
            state.answersProcess.push(`Q${state.currentQ + 1}-選項${optionIdx + 1}`);
            
            if(state.currentQ + 1 < questions.length) { 
                state.currentQ++; 
                render(); 
            } else { 
                state.view = 'result'; 
                render(); 
            }
        };

        window.setAccuracy = (v) => { state.accuracy = v; render(); };

        window.saveAll = async (mbti) => {
            if (state.accuracy === 0) { alert("請先評分精準度"); return; }
            const btn = document.getElementById('saveBtn');
            btn.innerText = "同步中...";
            btn.disabled = true;

            // 匹配你的 GAS 後端欄位名稱
            const payload = {
                account: state.username,                      // 對應 data.account (帳號)
                process: state.answersProcess.join(', '),      // 對應 data.process (作答過程)
                mbti: `${mbti} (${state.zodiac})`,            // 對應 data.mbti (分析結果)
                score: state.accuracy                         // 對應 data.score (分數)
            };

            try {
                // Firebase 儲存 (如果已配置 apiKey)
                if (db) { 
                    await addDoc(collection(db, 'artifacts', 'astral-coor', 'public', 'data', 'records'), { 
                        ...payload, 
                        createdAt: serverTimestamp() 
                    }); 
                }

                // GAS 同步
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    mode: 'no-cors' // 注意: no-cors 無法讀取 response body，但可成功送出
                });

                btn.innerText = "同步成功";
                btn.classList.add('bg-green-500', 'text-white');
            } catch (e) {
                console.error("Save error:", e);
                btn.innerText = "同步成功 (GAS)"; // no-cors 常觸發 catch 但其實已送出
                btn.classList.add('bg-green-500', 'text-white');
            }
        };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        window.onload = async () => {
            await initFirebase();
            render();
        };
    </script>
</body>
</html>
