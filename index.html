<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異星座標</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050810;
            color: white;
            overflow-x: hidden;
        }
        .serif { font-family: 'Noto Serif TC', serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        
        .mbti-glow {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(129, 140, 248, 0.4));
        }

        .option-btn {
            transition: all 0.2s ease;
            text-align: left;
        }
        .option-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateX(8px);
        }

        .accuracy-btn.active {
            background-color: #4f46e5;
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 直接顯示 App 容器 -->
    <div id="app" class="w-full max-w-5xl z-10 opacity-0 transition-opacity duration-500"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 配置 (若為空則自動忽略)
        const firebaseConfig = {
            apiKey: "", 
            authDomain: "", 
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbzsffAQD5mEX_8hXcxLECHzaceLhKlrDQA6RbeFH88LpSicUDIeEh9mJCumyFU3EYYt7A/exec";
        
        let db = null;
        let auth = null;

        // 初始化狀態
        let state = {
            view: 'start',
            username: '',
            zodiac: '未設定',
            currentQ: 0,
            scores: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 },
            accuracy: 0
        };

        // 靜默嘗試初始化 Firebase
        const initFirebase = async () => {
            if (firebaseConfig.apiKey) {
                try {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    await signInAnonymously(auth);
                } catch (e) {
                    console.log("Firebase disabled.");
                }
            }
        };

        const questions = [
            { q: "下課鐘響，你的「靈魂」通常會飄向哪裡？", dim: "EI", options: [{ text: "走廊！去別班串門子或是找人閒聊", type: "E" }, { text: "座位。戴上耳機，世界與我無關", type: "I" }, { text: "福利社。揪團買東西順便探險", type: "E" }, { text: "夢鄉。趴在桌上享受短暫的寧靜", type: "I" }]},
            { q: "班級要辦交換禮物，你的心情波動是？", dim: "EI", options: [{ text: "超興奮！已經在想怎麼炒熱氣氛了", type: "E" }, { text: "有點壓力，希望抽完趕快結束", type: "I" }, { text: "期待！最喜歡看大家抽到禮物的反應", type: "E" }, { text: "低調。默默準備好禮物，不想被關注", type: "I" }]},
            { q: "週末宅在家一整天，到了晚上你會？", dim: "EI", options: [{ text: "好悶啊！必須約朋友出去晃晃才行", type: "E" }, { text: "能量滿點！這才是真正的休息", type: "I" }, { text: "狂刷社群，看看大家都在玩什麼", type: "E" }, { text: "繼續沉浸在影集或遊戲的單人時光", type: "I" }]},
            { q: "社團討論活動進度時，你通常是？", dim: "EI", options: [{ text: "發言領袖。第一個提出想法帶動討論", type: "E" }, { text: "冷靜觀察。等大家都說完再給意見", type: "I" }, { text: "溝通橋樑。在各組之間協調穿梭", type: "E" }, { text: "幕後推手。默默記筆記並思考細節", type: "I" }]},
            { q: "關於「畢業典禮」的完美畫面，你希望？", dim: "EI", options: [{ text: "全班大合照、瘋狂錄影，熱鬧到不行", type: "E" }, { text: "跟幾個死黨私下合照，溫馨告別", type: "I" }, { text: "上台領獎或表演，留下閃耀回憶", type: "E" }, { text: "儀式結束後安安靜靜地離開校園", type: "I" }]},
            { q: "學習一門全新的科目時，你習慣從哪下手？", dim: "SN", options: [{ text: "看具體例題，搞懂公式怎麼帶入", type: "S" }, { text: "先聽大原理，搞清楚整體的邏輯架構", type: "N" }, { text: "把筆記抄得整齊漂亮，記住所有細節", type: "S" }, { text: "思考這科目跟未來或現實有什麼連結", type: "N" }]},
            { q: "朋友說起一件「靈異傳聞」，你的第一反應？", dim: "SN", options: [{ text: "追問細節：時間、地點、到底長怎樣？", type: "S" }, { text: "聯想：這背後是不是有什麼神祕暗示？", type: "N" }, { text: "科學分析：一定是環境或光影造成的錯覺", type: "S" }, { text: "畫面感：腦中瞬間浮現恐怖片場景", type: "N" }]},
            { q: "考慮未來的校系或職業，你更在意？", dim: "SN", options: [{ text: "具體的薪水、環境、跟實際錄取門檻", type: "S" }, { text: "這個領域未來的發展性與改變世界的可能", type: "N" }, { text: "校區交通、設施、跟我現在住的地方近不近", type: "S" }, { text: "這份工作是否能讓我實現某種理想", type: "N" }]},
            { q: "你最喜歡哪種風格的老師？", dim: "SN", options: [{ text: "指令清楚、講義重點整理得超好的老師", type: "S" }, { text: "會講很多課外知識、啟發思維的老師", type: "N" }, { text: "按部就班、考試範圍不亂變動的老師", type: "S" }, { text: "鼓勵大家討論、沒有標準答案的老師", type: "N" }]},
            { q: "走進圖書館，你會不由自主地走向？", dim: "SN", options: [{ text: "實用工具書、程式教學或旅遊雜誌", type: "S" }, { text: "科幻小說、哲學或探討未來的書籍", type: "N" }, { text: "名人自傳，看看他們成功的具體步驟", type: "S" }, { text: "充滿意境的詩集或前衛的視覺藝術書", type: "N" }]},
            { q: "朋友因為失戀找你哭訴，你的本能反應？", dim: "TF", options: [{ text: "理性分析：幫他列出對方的缺點讓其清醒", type: "T" }, { text: "情感共鳴：陪他一起罵，給他一個擁抱", type: "F" }, { text: "解決問題：問清楚導火線，看還有沒有救", type: "T" }, { text: "溫暖守候：先帶他去吃好吃的轉移心情", type: "F" }]},
            { q: "分組報告時，隊友進度落後，你會？", dim: "TF", options: [{ text: "直接在群組提醒，要求按時繳交", type: "T" }, { text: "私下關心他，問是不是最近心情不好", type: "F" }, { text: "重新分配，把比較難的部分拿回來自己做", type: "T" }, { text: "為了和諧，自己默默幫他補齊內容", type: "F" }]},
            { q: "你覺得哪種讚美最能讓你開心？", dim: "TF", options: [{ text: "「你的邏輯超強，這題解法太聰明了」", type: "T" }, { text: "「你真的很貼心，班上有你真好」", type: "F" }, { text: "「這企劃很專業，細節處理得非常到位", type: "T" }, { text: "「你很有獨特的氣質，靈魂很有趣」", type: "F" }]},
            { q: "面對「班級公約」，你的態度是？", dim: "TF", options: [{ text: "規則就是規則，違規就該照規定處理", type: "T" }, { text: "規則是死的人是活的，應視情況調整", type: "F" }, { text: "規定要符合邏輯，不能為了管理而管理", type: "T" }, { text: "規定是為了讓大家相處愉快，不能太冰冷", type: "F" }]},
            { q: "看到感人的弱勢扶助廣告，你第一時間想到？", dim: "TF", options: [{ text: "評估這組織的運作模式是否真的有效", type: "T" }, { text: "感到鼻酸，恨不得立刻衝去現場幫忙", type: "F" }, { text: "思考社會體制出了什麼問題才導致這樣", type: "T" }, { text: "聯想那些人的處境，心生同情與不捨", type: "F" }]},
            { q: "如果明天就是期末大考，你今晚的狀態是？", dim: "JP", options: [{ text: "按進度複習完畢，提早睡覺保持體力", type: "J" }, { text: "腎上腺素爆發，瘋狂熬夜衝刺", type: "P" }, { text: "一切都在掌握中，確認一下重點就行", type: "J" }, { text: "還在糾結到底要先讀哪一本才好", type: "P" }]},
            { q: "長假來臨前，你通常會怎麼規劃？", dim: "JP", options: [{ text: "寫好詳細計畫表，幾點起床都訂好了", type: "J" }, { text: "只有一個大方向，行程隨心情決定", type: "P" }, { text: "提前訂好所有車票飯店，不容許意外", type: "J" }, { text: "喜歡臨時起意，說走就走的感覺最刺激", type: "P" }]},
            { q: "你的書桌或個人空間通常是？", dim: "JP", options: [{ text: "井然有序，每樣東西都有它的固定位置", type: "J" }, { text: "亂中有序，雖然堆很多但我找得到", type: "P" }, { text: "貼滿待辦清單，確保沒有事情被遺漏", type: "J" }, { text: "充滿靈感小物，亂才是我創造力的來源", type: "P" }]},
            { q: "面對行程被突如其來的意外打亂，你會？", dim: "JP", options: [{ text: "感到焦慮，討厭原本的節奏與計畫被亂掉", type: "J" }, { text: "覺得好玩，喜歡驚喜跟意料之外的挑戰", type: "P" }, { text: "迅速制定新計畫，找回對生活的掌控感", type: "J" }, { text: "隨遇而安，覺得原本的計畫本來就是參考", type: "P" }]},
            { q: "你如何完成一份繁重的期末報告？", dim: "JP", options: [{ text: "每天固定寫一點，提早幾天就收工", type: "J" }, { text: "先蒐集資料，最後一刻才噴發寫完", type: "P" }, { text: "嚴格遵守大綱，確保架構從頭到尾一致", type: "J" }, { text: "邊寫邊改，常有突如其來的新想法加入", type: "P" }]}
        ];

        function render() {
            const container = document.getElementById('app');
            container.style.opacity = '1';

            if (state.view === 'start') {
                container.innerHTML = `
                    <div class="max-w-xl mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <h1 class="text-4xl md:text-5xl font-bold tracking-[0.2em] mb-10 serif mbti-glow">異星座標</h1>
                        <div class="space-y-6">
                            <input id="uIn" placeholder="輸入你的暱稱" value="${state.username}" class="w-full bg-white/5 border border-white/10 rounded-3xl py-4 px-8 text-center text-white outline-none focus:border-indigo-500">
                            <select id="zIn" class="w-full bg-white/5 border border-white/10 rounded-3xl py-4 px-8 text-center text-gray-400 outline-none appearance-none focus:border-indigo-500">
                                <option value="未設定">選擇星座標籤</option>
                                ${["牡羊座", "金牛座", "雙子座", "巨蟹座", "獅子座", "處女座", "天秤座", "天蠍座", "射手座", "摩羯座", "水瓶座", "雙魚座"].map(z => `<option value="${z}" ${state.zodiac === z ? 'selected' : ''}>${z}</option>`).join('')}
                            </select>
                            <button onclick="window.startQuiz()" class="w-full py-5 bg-indigo-600 rounded-3xl font-bold tracking-[0.5em] text-xl hover:bg-indigo-500 transition-all">開啟監測實驗</button>
                        </div>
                    </div>
                `;
                document.getElementById('uIn').oninput = (e) => state.username = e.target.value;
                document.getElementById('zIn').onchange = (e) => state.zodiac = e.target.value;
            } else if (state.view === 'quiz') {
                const q = questions[state.currentQ];
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto glass p-10 rounded-[40px] animate-fade-in">
                        <div class="mb-8 text-xl font-bold serif text-indigo-400">系統掃描：${state.currentQ + 1} / ${questions.length}</div>
                        <h2 class="text-2xl mb-10 serif leading-relaxed font-bold">${q.q}</h2>
                        <div class="grid gap-4">
                            ${q.options.map(o => `<button onclick="window.answer('${o.type}')" class="option-btn w-full p-5 bg-white/[0.03] border border-white/5 rounded-2xl hover:bg-white/[0.08]">${o.text}</button>`).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'result') {
                const mbti = calculateMBTI();
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto glass p-10 rounded-[50px] animate-fade-in text-center">
                        <h1 class="text-7xl font-bold mbti-glow serif italic mb-4">${mbti}</h1>
                        <p class="text-lg text-gray-400 mb-12">${state.username} 的星際座標</p>
                        
                        <div class="mb-10">
                            <p class="text-xs text-gray-500 mb-4">結果精準度評分</p>
                            <div class="flex justify-center gap-2">
                                ${[1,2,3,4,5].map(v => `<button onclick="window.setAccuracy(${v})" class="accuracy-btn w-10 h-10 rounded-lg border border-white/10 ${state.accuracy === v ? 'active' : ''}">${v}</button>`).join('')}
                            </div>
                        </div>

                        <button id="saveBtn" onclick="window.saveAll('${mbti}')" class="w-full py-5 bg-white text-black rounded-3xl font-bold tracking-[0.5em] hover:bg-gray-200 transition-all">同步資料庫</button>
                    </div>
                `;
            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定') { state.view = 'quiz'; render(); } };
        window.answer = (type) => { 
            state.scores[type]++; 
            if(state.currentQ + 1 < questions.length) { state.currentQ++; render(); } 
            else { state.view = 'result'; render(); }
        };
        window.setAccuracy = (v) => { state.accuracy = v; render(); };

        window.saveAll = async (mbti) => {
            if (state.accuracy === 0) { alert("請先評分精準度"); return; }
            const btn = document.getElementById('saveBtn');
            btn.innerText = "同步中...";
            btn.disabled = true;

            const payload = {
                username: state.username,
                zodiac: state.zodiac,
                mbti: mbti,
                accuracy: state.accuracy,
                timestamp: new Date().toLocaleString('zh-TW')
            };

            try {
                if (db) {
                    await addDoc(collection(db, 'records'), { ...payload, createdAt: serverTimestamp() });
                }
                const queryParams = new URLSearchParams(payload).toString();
                await fetch(`${GAS_URL}?${queryParams}`, { mode: 'no-cors' });
                
                btn.innerText = "同步成功";
                btn.classList.add('bg-green-500', 'text-white');
            } catch (e) {
                btn.innerText = "同步完成";
                btn.classList.add('bg-green-500', 'text-white');
            }
        };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        window.onload = async () => {
            await initFirebase();
            render();
        };
    </script>
</body>
</html>
