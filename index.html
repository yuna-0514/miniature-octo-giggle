                life: "設定目標並達成它讓你感到滿足。但別把人生看成一連串的關卡，學會停下來看看路邊的風景，那也是收穫。" 
            },
            "水瓶座": { 
                core: "未來的星際波長", 
                love: "靈魂的獨特性對你最重要。找一個能理解你「古怪」且不試圖改變你的人。在保持獨立的同時，也練習融入人群的情感。", 
                friend: "你有很多有趣的朋友，但交心很難。試著打破那層理智的隔閡，展現你的真實情緒，朋友會更想靠近你。", 
                life: "科技與社會趨勢能激發你的熱情。參加一些具有前瞻性的社群或計畫，能讓你的靈魂感受到與未來的連結。" 
            },
            "雙魚座": { 
                core: "夢幻的深海回聲", 
                love: "浪漫與幻想是你的養分。但要小心別在愛情的迷霧中迷失自我，適度建立現實邊界，能保護你不受傷害。", 
                friend: "你極具同情心，常成為別人的情緒垃圾桶。練習「能量切割」，別讓別人的負能量沈澱在你的深海裡。", 
                life: "藝術、冥想與水源能洗滌你的疲憊。每天給自己一段無人打擾的夢境時間，那是你重整靈魂神經的重要過程。" 
            }
        };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                const guard = document.getElementById('auth-guard');
                if (guard) guard.remove();
                document.getElementById('app').style.opacity = '1';
                render();
            });
        };

        initAuth();

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <div class="mb-4 text-[10px] text-indigo-400 font-mono tracking-[0.5em] uppercase">Experiment ID: SOUL-20-PULSE</div>
                        <h1 class="text-3xl font-bold tracking-[0.1em] mb-4 serif">異星座標</h1>
                        <p class="text-xs text-gray-500 mb-10 tracking-[0.2em] leading-relaxed">20題脈衝測驗<br>精準定位你的靈魂頻率與星際導航建議</p>
                        <div class="space-y-4">
                            <input id="uIn" placeholder="輸入觀測代號" value="${state.username}" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-center focus:border-indigo-500/50 outline-none transition-all placeholder:text-gray-700">
                            <select id="zIn" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-center focus:border-indigo-500/50 outline-none text-gray-400 appearance-none cursor-pointer">
                                <option value="未設定">請選擇你的星座標籤</option>
                                ${Object.keys(zodiacData).map(z => `<option value="${z}" ${state.zodiac === z ? 'selected' : ''}>${z}</option>`).join('')}
                            </select>
                            <button onclick="startQuiz()" class="w-full py-5 mt-4 rounded-2xl font-bold tracking-[0.5em] bg-indigo-600 hover:bg-indigo-500 transition-all">開啟監測</button>
                        </div>
                    </div>
                `;
                document.getElementById('uIn').oninput = (e) => state.username = e.target.value;
                document.getElementById('zIn').onchange = (e) => state.zodiac = e.target.value;
            } else if (state.view === 'quiz') {
                const q = questions[state.currentQ];
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto glass p-10 rounded-[40px] animate-fade-in">
                        <div class="flex justify-between items-center mb-10">
                            <div class="text-xl font-bold serif text-indigo-100">${state.currentQ + 1} <span class="text-[10px] text-gray-600 font-normal">/ 20</span></div>
                            <div class="flex-1 mx-6 h-[2px] bg-white/5 rounded-full relative">
                                <div class="absolute inset-0 bg-indigo-500/30 transition-all duration-500" style="width: ${(state.currentQ + 1) / questions.length * 100}%"></div>
                            </div>
                        </div>
                        <h2 class="text-lg mb-10 serif leading-relaxed text-gray-200">${q.q}</h2>
                        <div class="space-y-3">
                            ${q.options.map((opt) => `
                                <button onclick="answer('${opt.type}')" class="option-btn w-full p-5 bg-white/[0.02] border border-white/5 rounded-2xl text-sm text-gray-400 hover:text-white">
                                    ${opt.text}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'pre-result') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <div class="mb-4 text-indigo-400 text-3xl">📡</div>
                        <h3 class="text-lg font-bold serif mb-6">脈衝同步率調查</h3>
                        <p class="text-sm text-gray-400 mb-8 leading-relaxed">在生成最終報告前，請告知我們：<br>你覺得題目捕捉到你真實自我的精準度？</p>
                        <div class="flex justify-center gap-2 mb-10">
                            ${[1,2,3,4,5].map(v => `
                                <button onclick="setAccuracy(${v})" class="w-12 h-12 rounded-xl border border-white/10 flex items-center justify-center hover:bg-indigo-600 transition-all">
                                    ${v}
                                </button>
                            `).join('')}
                        </div>
                        <p class="text-[10px] text-gray-600">(1為極低，5為極高)</p>
                    </div>
                `;
            } else if (state.view === 'result') {
                const mbti = calculateMBTI();
                const info = zodiacData[state.zodiac] || { core: "連結中...", love: "...", friend: "...", life: "..." };
                
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto glass p-8 md:p-12 rounded-[40px] animate-fade-in mb-10">
                        <div class="text-center mb-12">
                            <div class="text-[10px] text-indigo-400 tracking-[0.5em] font-mono mb-3 uppercase">PULSE RECORD ANALYZED</div>
                            <h1 class="text-6xl font-bold mbti-glow serif italic mb-4">${mbti}</h1>
                            <div class="text-xs text-gray-500 tracking-widest uppercase">代號: ${state.username} | 座標: ${state.zodiac} | 同步率: ${state.accuracy}/5</div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="bg-indigo-500/5 border border-indigo-500/10 rounded-[32px] p-8 col-span-1 md:col-span-2 shadow-inner">
                                <h3 class="text-[10px] font-bold text-indigo-300 mb-3 tracking-widest uppercase">核心能級建議</h3>
                                <p class="text-2xl serif italic text-white mb-4">「${info.core}」</p>
                                <p class="text-sm text-gray-400 leading-relaxed">你的存在像是宇宙中一道獨特的脈衝，擁有極強的穩定性與穿透力。目前的能量狀態穩定，建議在維持現狀的同時，多嘗試打破舒適圈，能讓你獲得更多的星際養分。</p>
                            </div>
                            
                            <div class="bg-white/[0.02] border border-white/5 rounded-[32px] p-8 transition-all hover:bg-white/[0.04]">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-2 h-2 rounded-full bg-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.5)]"></div>
                                    <h4 class="text-pink-400 text-[10px] font-bold tracking-widest uppercase">引力對應 (愛情建議)</h4>
                                </div>
                                <p class="text-sm text-gray-300 leading-relaxed font-light">${info.love}</p>
                            </div>
                            
                            <div class="bg-white/[0.02] border border-white/5 rounded-[32px] p-8 transition-all hover:bg-white/[0.04]">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                                    <h4 class="text-emerald-400 text-[10px] font-bold tracking-widest uppercase">衛星連結 (友情建議)</h4>
                                </div>
                                <p class="text-sm text-gray-300 leading-relaxed font-light">${info.friend}</p>
                            </div>
                            
                            <div class="bg-white/[0.02] border border-white/5 rounded-[32px] p-8 col-span-1 md:col-span-2 transition-all hover:bg-white/[0.04]">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
                                    <h4 class="text-amber-400 text-[10px] font-bold tracking-widest uppercase">軌道運行 (生活建議)</h4>
                                </div>
                                <p class="text-sm text-gray-300 leading-relaxed font-light">${info.life}</p>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row gap-4 mt-12">
                            <button id="saveBtn" class="flex-1 py-5 bg-white text-black hover:bg-indigo-50 rounded-2xl text-[10px] font-bold tracking-[0.5em] uppercase transition-all">
                                ${state.isSaving ? '數據封裝中...' : '提交實驗報告'}
                            </button>
                            <button onclick="location.reload()" class="flex-1 py-5 bg-white/5 border border-white/10 text-gray-500 hover:text-white rounded-2xl text-[10px] font-bold tracking-[0.5em] uppercase transition-all">
                                重新啟動監測
                            </button>
                        </div>
                    </div>
                `;
                document.getElementById('saveBtn').onclick = () => saveResult(mbti);
            }
        }

        window.startQuiz = () => {
            if (!state.username || state.zodiac === '未設定') {
                alert("請完整輸入觀測代號並選擇星座標籤。");
                return;
            }
            state.view = 'quiz';
            render();
        };

        window.answer = (type) => {
            state.scores[type]++;
            if (state.currentQ + 1 < questions.length) {
                state.currentQ++;
                render();
            } else {
                state.view = 'pre-result';
                render();
            }
        };

        window.setAccuracy = (val) => {
            state.accuracy = val;
            state.view = 'result';
            render();
        };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        async function saveResult(mbti) {
            if (!state.user || state.isSaving) return;
            state.isSaving = true;
            render();
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pulseRecords'), {
                    username: state.username,
                    zodiac: state.zodiac,
                    mbti: mbti,
                    accuracy: state.accuracy,
                    timestamp: serverTimestamp()
                });
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.innerHTML = "數據已上傳星軌";
                saveBtn.disabled = true;
                saveBtn.classList.add('bg-emerald-500', 'text-white');
            } catch (e) {
                console.error(e);
                alert("數據同步失敗，請檢查網路連線。");
                state.isSaving = false;
                render();
            }
        }
    </script>
</body>
</html>
