                    </div>
                `;
            } else if (state.view === 'result') {
                const mbti = calculateMBTI();
                const advice = zodiacAdvice[state.zodiac] || { core: "", love: "", friend: "", life: "" };
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fade-in pb-20">
                        <div class="glass p-12 text-center">
                            <h1 class="text-8xl font-bold mbti-glow serif italic mb-6 tracking-tight">${mbti}</h1>
                            <p class="text-2xl text-slate-700 mb-2 font-medium">${state.username} · ${state.zodiac}</p>
                            <div class="inline-block px-5 py-1.5 bg-indigo-100/50 rounded-full text-xs tracking-widest text-indigo-700 font-bold uppercase border border-indigo-200">ASTRAL COORDINATES COMPLETED</div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="glass p-10 space-y-6">
                                <h3 class="text-2xl font-bold serif text-indigo-800 flex items-center">
                                    <span class="mr-3">🪐</span> 星座核心建議
                                </h3>
                                <p class="text-lg leading-relaxed text-slate-700">${advice.core}</p>
                                <div class="pt-4 space-y-4">
                                    <div class="bg-rose-50/50 p-5 rounded-3xl border border-rose-100">
                                        <h4 class="text-lg font-bold text-rose-600 mb-1">💘 愛情導航</h4>
                                        <p class="text-slate-600 text-base">${advice.love}</p>
                                    </div>
                                    <div class="bg-blue-50/50 p-5 rounded-3xl border border-blue-100">
                                        <h4 class="text-lg font-bold text-blue-700 mb-1">🤝 友情引力</h4>
                                        <p class="text-slate-600 text-base">${advice.friend}</p>
                                    </div>
                                    <div class="bg-emerald-50/50 p-5 rounded-3xl border border-emerald-100">
                                        <h4 class="text-lg font-bold text-emerald-700 mb-1">🌿 生活校準</h4>
                                        <p class="text-slate-600 text-base">${advice.life}</p>
                                    </div>
                                </div>
                            </div>

                            <div class="glass p-10 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-2xl font-bold serif text-indigo-800 mb-8">本次實驗精準度？</h3>
                                    <div class="flex justify-between gap-3 mb-10">
                                        ${[1,2,3,4,5].map(v => `
                                            <button onclick="window.setAccuracy(${v})" class="accuracy-btn ${state.accuracy === v ? 'active' : ''}">
                                                ${v}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <p class="text-slate-500 text-center italic font-light">1 分為偏差極大，5 分為完美契合</p>
                                </div>
                                <button id="saveBtn" onclick="window.saveAll('${mbti}')" class="w-full py-6 bg-slate-800 text-white rounded-[2rem] font-bold tracking-[0.5em] text-xl hover:bg-slate-900 shadow-xl transition-all mt-10">同步星際資料庫</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定') { state.view = 'quiz'; render(); } else { alert("請輸入暱稱並選擇星座"); } };
        
        window.answer = (type, optionIdx) => { 
            state.scores[type]++;
            state.answersProcess.push(`Q${state.currentQ + 1}-選項${optionIdx + 1}`);
            
            if(state.currentQ + 1 < questions.length) { 
                state.currentQ++; 
                render(); 
            } else { 
                state.view = 'result'; 
                render(); 
            }
        };

        window.setAccuracy = (v) => { state.accuracy = v; render(); };

        window.saveAll = async (mbti) => {
            if (state.accuracy === 0) { alert("請先評分精準度"); return; }
            const btn = document.getElementById('saveBtn');
            btn.innerText = "同步中...";
            btn.disabled = true;

            const payload = {
                account: state.username,
                process: state.answersProcess.join(', '),
                mbti: `${mbti} (${state.zodiac})`,
                score: state.accuracy
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    mode: 'no-cors'
                });
                btn.innerText = "同步成功";
                btn.style.backgroundColor = "#059669";
            } catch (e) {
                btn.innerText = "同步失敗 (請稍後再試)";
                btn.disabled = false;
            }
        };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        window.onload = () => { render(); };
    </script>
</body>
</html>
