        .loading-pulse {

            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定') { state.view = 'quiz'; render(); } };
        window.answer = (type) => { 
            state.scores[type]++; 
            if(state.currentQ + 1 < questions.length) { state.currentQ++; render(); } 
            else { state.view = 'result'; render(); }
        };
        window.setAccuracy = (v) => { state.accuracy = v; render(); };

        window.saveAll = async (mbti) => {
            if (state.accuracy === 0) { alert("請先評分精準度"); return; }
            state.isSaving = true;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "同步中 (GAS + Firebase)...";
            btn.disabled = true;

            const payload = {
                username: state.username,
                zodiac: state.zodiac,
                mbti: mbti,
                accuracy: state.accuracy,
                timestamp: new Date().toISOString()
            };

            try {
                // 1. 同步到 Firebase (原本邏輯)
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'records'), {
                    ...payload,
                    timestamp: serverTimestamp()
                });

                // 2. 同步到你的 Google Script (新聯動)
                // 注意：GAS Web App 通常不支援 CORS POST，我們改用 URLSearchParams 並模擬 GET 請求
                const queryParams = new URLSearchParams(payload).toString();
                await fetch(`${GAS_URL}?${queryParams}`, { mode: 'no-cors' });

                btn.innerText = "同步成功";
                btn.style.backgroundColor = "#10b981";
                btn.style.color = "white";
            } catch (e) {
                console.error(e);
                btn.innerText = "同步完成 (已送出)"; // no-cors 下 fetch 可能報錯但其實資料已送出
            }
        };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        window.onload = init;
    </script>
</body>
</html>
