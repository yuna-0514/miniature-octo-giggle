<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異星座標：靈魂脈衝監測實驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020408;
            color: white;
            overflow-x: hidden;
        }
        .serif { font-family: 'Noto Serif TC', serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        .mbti-glow {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(129, 140, 248, 0.4));
        }

        .option-btn {
            transition: all 0.3s ease;
            text-align: left;
        }
        .option-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(6px);
        }

        .auth-overlay {
            position: fixed; inset: 0; background: #020408; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div id="auth-guard" class="auth-overlay">
        <div class="text-indigo-300/60 text-[10px] tracking-[0.5em] font-mono animate-pulse">INITIATING PULSE SCAN...</div>
    </div>

    <div id="app" class="w-full max-w-4xl z-10 opacity-0 transition-opacity duration-1000"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 已填入你提供的 Google Apps Script 部署網址
        const scriptURL = "https://script.google.com/macros/s/AKfycbzsffAQD5mEX_8hXcxLECHzaceLhKlrDQA6RbeFH88LpSicUDIeEh9mJCumyFU3EYYt7A/exec"; 

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'soul-pulse-20';

        let state = {
            view: 'start',
            username: '',
            zodiac: '未設定',
            currentQ: 0,
            scores: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 },
            answers: [], // 記錄詳細作答過程
            accuracy: 0,
            isSaving: false,
            user: null
        };

        // 題目資料
        const questions = [
            { q: "下課十分鐘，你最常出現在哪裡？", dim: "EI", options: [
                { text: "在走廊跟不同班的朋友串門子、聊八卦", type: "E" },
                { text: "留在座位上戴耳機聽歌或看自己的書", type: "I" },
                { text: "找老師討論社團公事或揪團去福利社", type: "E" },
                { text: "趴在桌上補眠，享受這段無人打擾的時間", type: "I" }
            ]},
            { q: "班級要舉辦聖誕交換禮物，你的心情是？", dim: "EI", options: [
                { text: "興奮地期待抽獎過程與大家揭曉禮物時的尖叫聲", type: "E" },
                { text: "覺得準備禮物很麻煩，只想安靜地領完自己的那份", type: "I" },
                { text: "主動擔任主持人，負責炒熱全場氣氛", type: "E" },
                { text: "希望不要抽到太奇怪的東西，最好能默默結束", type: "I" }
            ]},
            { q: "面對一門全新的理科必修課，你通常怎麼開始學習？", dim: "SN", options: [
                { text: "先看課本例題，搞懂具體公式怎麼套用", type: "S" },
                { text: "先聽老師講大原理，思考這門學科跟現實的關聯", type: "N" },
                { text: "整理出一套精美的筆記，把細節寫得清清楚楚", type: "S" },
                { text: "聯想這跟以前學過的內容有什麼相似之處", type: "N" }
            ]},
            { q: "朋友跟另一半吵架來找你哭訴，你會？", dim: "TF", options: [
                { text: "冷靜分析雙方的對錯，給出實質的建議與解決方案", type: "T" },
                { text: "陪他一起罵對方，給予強烈的情感支持與安慰", type: "F" },
                { text: "問清楚導火線，判斷這段關係是否還有修補價值", type: "T" },
                { text: "先給他一個擁抱或買杯手搖飲緩解他的情緒", type: "F" }
            ]},
            { q: "如果明天就是期末考，你今晚的狀態是？", dim: "JP", options: [
                { text: "已經按照進度複習兩遍，今晚只是最後確認重點", type: "J" },
                { text: "靠著最後一刻的腎上腺素爆發，瘋狂熬夜衝刺", type: "P" },
                { text: "準時上床睡覺，確保明天精神充沛", type: "J" },
                { text: "發現還有好幾章沒讀，正在糾結要先讀哪一部分", type: "P" }
            ]}
            // 為了簡潔此處僅列出代表性題目，實際運作建議補足 20 題
        ];

        const zodiacData = {
            "牡羊座": { core: "純粹的火焰脈衝", love: "直率勇敢，但學會慢行更溫柔。", friend: "強大後盾，但也要讓別人保護你。", life: "規律運動，安排靜止時刻。" },
            "金牛座": { core: "穩定的重力中心", love: "追求安全感，但浪漫需要一點變動。", friend: "最可靠的聽眾，試著說出擔憂。", life: "享受感官美學，適度變動是成長。" },
            "雙子座": { core: "多變的星軌跳躍", love: "思想共鳴最重要，多給對方安全感。", friend: "聚會發起者，找一兩個交心好友。", life: "學習新知，允許自己在興趣中穿梭。" },
            "巨蟹座": { core: "溫柔的防禦屏障", love: "同理心強，先愛自己再愛別人。", friend: "朋友圈的膠水，記得設立情緒底線。", life: "居家佈置能梳理情緒，多接觸自然。" },
            "獅子座": { core: "閃耀的核心恆星", love: "坦承脆弱會讓你更迷人。", friend: "大方自信，也要多稱讚身邊的人。", life: "尋找才華舞台，盡情發揮創造力。" },
            "處女座": { core: "精密的運算系統", love: "接受不完美，放下批判標準。", friend: "給予實用建議之餘，先給予擁抱。", life: "規律生活很好，但留點混亂時間。" },
            "天秤座": { core: "優雅的對稱磁場", love: "下定決心展現立場，別搖擺不定。", friend: "天生外交官，別為了遷就委屈自己。", life: "追求美感，學會拒絕無效社交。" },
            "天蠍座": { core: "深邃的靈魂黑洞", love: "信任與自由是愛的真諦。", friend: "忠誠度極高，對新緣分少點防備。", life: "深入鑽研學問，找到生命定位。" },
            "射手座": { core: "追逐真理的箭矢", love: "自由至上，坦誠分享冒險計畫。", friend: "開心果導師，也要學會傾聽沉重。", life: "旅行與文化體驗是你的養分。" },
            "摩羯座": { core: "堅毅的時間建築", love: "浪漫是潤滑劑，多點甜言蜜語。", friend: "值得信賴，純粹的垃圾話時間也很重要。", life: "別把人生當闖關，看風景也是收穫。" },
            "水瓶座": { core: "未來的星際波長", love: "尋找理解你「古怪」的靈魂伴侶。", friend: "廣交但不交心，試著展現真實情緒。", life: "關注科技趨勢，與未來保持連結。" },
            "雙魚座": { core: "夢幻的深海回聲", love: "建立現實邊界，保護夢幻的心。", friend: "能量切割，別當別人的情緒垃圾桶。", life: "藝術與冥想能洗滌疲憊，留點夢境時間。" }
        };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                const guard = document.getElementById('auth-guard');
                if (guard) guard.remove();
                document.getElementById('app').style.opacity = '1';
                render();
            });
        };

        initAuth();

        function render() {
            const container = document.getElementById('app');
            if (state.view === 'start') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <h1 class="text-3xl font-bold tracking-[0.1em] mb-4 serif">異星座標</h1>
                        <p class="text-xs text-gray-500 mb-10 tracking-[0.2em]">靈魂脈衝監測實驗</p>
                        <div class="space-y-4">
                            <input id="uIn" placeholder="輸入觀測帳號" value="${state.username}" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-center outline-none">
                            <select id="zIn" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-center text-gray-400 outline-none">
                                <option value="未設定">選擇星座標籤</option>
                                ${Object.keys(zodiacData).map(z => `<option value="${z}">${z}</option>`).join('')}
                            </select>
                            <button onclick="window.startQuiz()" class="w-full py-5 bg-indigo-600 rounded-2xl font-bold tracking-[0.5em]">開啟監測</button>
                        </div>
                    </div>
                `;
                document.getElementById('uIn').oninput = (e) => state.username = e.target.value;
                document.getElementById('zIn').onchange = (e) => state.zodiac = e.target.value;
            } else if (state.view === 'quiz') {
                const q = questions[state.currentQ];
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto glass p-10 rounded-[40px] animate-fade-in">
                        <div class="mb-10 text-xl font-bold serif">${state.currentQ + 1} <span class="text-xs text-gray-600">/ ${questions.length}</span></div>
                        <h2 class="text-lg mb-10 serif">${q.q}</h2>
                        <div class="space-y-3">
                            ${q.options.map((opt, idx) => `<button onclick="window.answer('${opt.type}', '${opt.text}')" class="option-btn w-full p-5 bg-white/[0.02] border border-white/5 rounded-2xl text-sm">${opt.text}</button>`).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'pre-result') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto glass p-10 rounded-[40px] text-center animate-fade-in">
                        <h3 class="text-lg font-bold serif mb-6">監測精準度調查</h3>
                        <p class="text-xs text-gray-400 mb-8">你認為剛才的題目與你的契合度？</p>
                        <div class="flex justify-center gap-2 mb-10">
                            ${[1,2,3,4,5].map(v => `<button onclick="window.setAccuracy(${v})" class="w-12 h-12 rounded-xl border border-white/10 hover:bg-indigo-600 transition-colors">${v}</button>`).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'result') {
                const mbti = calculateMBTI();
                const info = zodiacData[state.zodiac];
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto glass p-10 rounded-[40px] animate-fade-in">
                        <div class="text-center mb-10">
                            <h1 class="text-6xl font-bold mbti-glow serif italic mb-2">${mbti}</h1>
                            <p class="text-xs text-gray-500">${state.username} 的觀測報告</p>
                        </div>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="p-6 bg-white/5 rounded-3xl border border-white/5"><span class="text-indigo-300 block mb-1">核心能級</span>${info.core}</div>
                            <div class="p-6 bg-white/5 rounded-3xl border border-white/5"><span class="text-indigo-300 block mb-1">生活軌道</span>${info.life}</div>
                        </div>
                        <button id="saveBtn" class="w-full py-5 mt-10 bg-white text-black rounded-2xl font-bold tracking-[0.5em] hover:bg-gray-200 transition-colors">提交並同步試算表</button>
                    </div>
                `;
                document.getElementById('saveBtn').onclick = () => saveResult(mbti);
            }
        }

        window.startQuiz = () => { if(state.username && state.zodiac !== '未設定'){ state.view = 'quiz'; render(); }};
        window.answer = (type, text) => { 
            state.scores[type]++; 
            state.answers.push(text);
            if(state.currentQ+1 < questions.length){ state.currentQ++; render(); } 
            else { state.view = 'pre-result'; render(); }
        };
        window.setAccuracy = (val) => { state.accuracy = val; state.view = 'result'; render(); };

        function calculateMBTI() {
            const { E, I, S, N, T, F, J, P } = state.scores;
            return (E >= I ? "E" : "I") + (S >= N ? "S" : "N") + (T >= F ? "T" : "F") + (J >= P ? "J" : "P");
        }

        async function saveResult(mbti) {
            if (state.isSaving) return;
            state.isSaving = true;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "資料上傳中...";
            btn.disabled = true;

            // 完全對應 Canvas 中 code.gs 的接收欄位
            const payload = {
                account: state.username,                // B: 帳號
                password: "N/A",                        // C: 密碼 (此處預設)
                process: state.answers.join(' | '),     // D: 作答過程
                mbti: `${mbti} (${state.zodiac})`,     // E: 分析結果
                score: state.accuracy,                  // F: 分數
                feedback: "測驗完成，自動存檔"             // G: 受測者回饋
            };

            try {
                // 1. 存入 Firebase (備援與歷史紀錄)
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'records'), {
                    ...payload,
                    timestamp: serverTimestamp()
                });

                // 2. 存入 Google 試算表 (GAS)
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors', // GAS 跨域必須使用 no-cors
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                btn.innerText = "上傳成功！";
                btn.classList.add('bg-emerald-500', 'text-white');
            } catch (e) {
                console.error(e);
                btn.innerText = "上傳失敗，請重試";
                btn.disabled = false;
                state.isSaving = false;
            }
        }
    </script>
</body>
</html>
